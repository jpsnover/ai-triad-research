packages:
  - taxonomy-editor
  - lib
  - lib/debate
  - poviewer
  - summary-viewer
  - workflow-app

overrides:
  axios: ">=1.8.4"
  adm-zip: ">=0.6.0"
  brace-expansion: ">=2.0.2"
  sharp: ">=0.35.4 <0.36"
  fast-xml-parser: ">=5.10.1"
  ip-address: ">=10.3.1"
  uuid: ">=11.1.1"
  "@opentelemetry/core": ">=2.8.0"
  js-yaml: ">=4.3.1"
  image-size: ">=1.2.2"
  # Security bumps (t/3283, Dependabot #338-341/#336/#326). Capped to the patched line, NOT
  # bare ">=", so (a) the fix stays minimal-blast-radius — fast-uri <4 avoids a major-version
  # jump, @xmldom <0.9 stays in the 0.8 line — and (b) the root and standalone lockfiles
  # converge on the SAME version (a bare ">=" let the standalone lockfile the prod image uses
  # resolve fast-uri@4.1.4 / @xmldom@0.9.12 while root resolved 3.1.7 / 0.8.15 — prod would
  # then run code CI never verified). Relax a cap only with a deliberate major/minor upgrade.
  fast-uri: ">=3.1.6 <4"
  "@xmldom/xmldom": ">=0.8.15 <0.9"
  browserslist: ">=4.28.7"
  # Security bumps (t/3440 root + t/3441 taxonomy-editor, Dependabot #350/#346-348 + #351/#349/#343/#342).
  # Transitive deps — sharp arrives via @huggingface/transformers, hono via @hono/node-server plus
  # @modelcontextprotocol/sdk. A direct `pnpm update` bumped only the direct edge and left transitive
  # copies vulnerable (t/3440 reopen) — overrides force EVERY instance. Capped to the patched line per
  # the convergence rule above. sharp raised in place (was >=0.35.0, which 0.35.3 satisfied). morgan
  # and joi are no-ops on the root lockfile (already patched via #2137) but are the floor the standalone
  # sync (sync-standalone-lockfile.mjs copies THIS block) needs for taxonomy-editor (t/3441).
  # NB — comment lines here must avoid a colon-then-space sequence; check-lockfile-overrides.mjs is
  # line-based and mis-reads any such line as an override entry (that caused the t/3440 gate red).
  hono: ">=4.13.5 <5"
  morgan: ">=1.12.0 <2"
  joi: ">=18.2.5 <19"

allowBuilds:
  '@google/genai': true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
