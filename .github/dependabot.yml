version: 2

# ── Dependabot throttling (t/1991) ──────────────────────────────────────────
# 12 ecosystems were previously ALL weekly with aggregate open-PR headroom ~59;
# a 25-PR pile accumulated unnoticed because nothing throttled inflow and no
# process doc drains it. Retuned so an untriaged week is VISIBLE (ecosystems pin
# at low limits) instead of being silently absorbed. Aggregate headroom now ~27.
#   - npm minor/patch are GROUPED (~one PR per dir per week); MAJOR bumps stay
#     individual so each gets 1:1 review.
#   - Low-churn ecosystems (github-actions, docker base images) moved to monthly.
#   - Expected steady state with weekly triage: ~5-8 open dependabot PRs.
# Change the limits here (not by manually closing PRs) if the pile reappears.
updates:
  # ── npm — grouped minor/patch, majors individual ──
  - package-ecosystem: npm
    directory: /taxonomy-editor  # largest app (most deps) — a little more headroom
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # undici MAJOR is HELD (t/2053/t/2113/t/2281; #1091). The GitHub REST client passes an
      # undici.Agent as `dispatcher:` to Node's built-in fetch; per assertUndiciMajorInvariant,
      # userland undici major MUST equal Node's bundled undici major (node:22.23.2 → undici 6.x),
      # or fetch silently ignores the dispatcher and falls back to TLS session caching
      # (CVE-2026-58040). A userland-only major bump (e.g. 6→8) reintroduces that condition and
      # reds githubApi.test.ts. minor/patch within the pinned major still flow (security patches).
      # REVISIT when the pinned Node runtime bundles a newer undici major, then bump both together.
      - dependency-name: undici
        update-types: [version-update:semver-major]

  # ── npm workspace ROOT — owns the pnpm workspace's lockfile-less members ──
  # poviewer / summary-viewer / workflow-app / lib are pnpm-WORKSPACE members
  # (pnpm-workspace.yaml) with NO in-dir lockfile — they share the ONE root
  # pnpm-lock.yaml. A per-app `directory:` entry bumps only that member's
  # package.json and can't reach the root lockfile, so `pnpm install
  # --frozen-lockfile` reds with ERR_PNPM_OUTDATED_LOCKFILE before build/test
  # ever runs (t/3116; surfaced by electron 43→44 #1645/#1648/#1649). A single
  # workspace ROOT entry updates member manifests + the shared root lockfile in
  # the SAME PR, so frozen-install stays green. Do NOT re-add per-app entries
  # for these four members.
  #
  # taxonomy-editor + lib/debate are ALSO workspace members but keep their own
  # entries (above/below): each carries an in-dir STANDALONE lockfile (Docker /
  # isolated build, synced via scripts/sync-standalone-lockfile.mjs +
  # lockfile-overrides-check, t/2188) that Dependabot updates correctly per
  # directory. WATCH-ITEM (t/3116): confirm the first post-merge Dependabot
  # cycle does not ALSO emit workspace-root PRs for those two (double-manage);
  # if it does, add per-dependency ignores here. Fallback if root-lockfile
  # regen proves unreliable: a lockfile-heal step on member PRs (t/3116 opt B).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 4

  - package-ecosystem: npm
    directory: /lib/debate
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /deploy/azure/runner/function
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 2

  # ── github-actions — monthly (actions rarely change; weekly was noise) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # ── pip — the PowerShell module's Python helpers (scripts/requirements.txt) ──
  # Grouped: requirements.txt is one logical set (was ungrouped — each bump its
  # own PR). No major-ignore (t/1989): the prior "5.x breaks the embedding
  # pipeline" reason was disproved (5.6.1 is value-stable, bit-identical vectors);
  # the python-embed-smoke CI gate now VALIDATES bumps (cosine vs a pinned
  # reference — reds on real drift or a load/API break), so dependabot may propose
  # majors and the gate decides. An ignore would only hide them.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      pip-deps:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # ── docker — web image + azure base image. Monthly (base images update rarely).
  # Left UNGROUPED deliberately: each directory tracks a SINGLE base image, so a
  # group could never batch more than one PR (one image = one bump).
  # node MAJOR bumps are HELD (t/1990): Node 26 is a Current release (started
  # 2026-05-05); native addons (onnxruntime-node prebuilts, node-pty) lag on
  # Current, the baked ONNX model could fail to load, and prod should run LTS.
  # REVISIT when Node 26 reaches Active LTS — 2026-10-28 (nodejs.org): drop the
  # `node` semver-major ignore below and bump both docker dirs together
  # (deploy/azure base image first, then taxonomy-editor). node minor/patch (22.x)
  # still flow for security patches.
  - package-ecosystem: docker
    directory: /taxonomy-editor
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /deploy/azure
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
