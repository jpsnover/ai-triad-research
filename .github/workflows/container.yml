# ─── Container Image ───
# What:  Builds the taxonomy-editor Docker image with baked-in taxonomy snapshot
#        for fallback data. Pushes to GHCR. Includes Trivy scan and SBOM.
# Before: Ensure the base image exists in GHCR (run base-image workflow if needed).
#         Triggers on version tag push (v*) or manual dispatch.
# After:  Image is available in GHCR. Auto-Deploy to Staging fires automatically.
#         For production, manually trigger the Deploy to Azure workflow.

name: Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write  # For SARIF upload
  id-token: write          # For build provenance attestation
  attestations: write      # For build provenance attestation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taxonomy-editor

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking CI status for ${{ github.sha }}..."
          # Find the most recent CI run for this commit
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || echo "")
          if [ "$CONCLUSION" = "success" ]; then
            echo "CI passed for this commit"
          elif [ -z "$CONCLUSION" ]; then
            echo "::error::No CI run found for commit ${{ github.sha }}. Push to main to trigger CI first."
            exit 1
          else
            echo "::error::CI status is '$CONCLUSION' for commit ${{ github.sha }}. CI must pass before building a container image."
            exit 1
          fi

  build-and-push:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: taxonomy-editor/Dockerfile
          failure-threshold: error

      - name: Verify base image exists
        run: |
          BASE_TAG=$(grep -oP 'FROM ghcr\.io/jpsnover/ai-triad-base:\K\S+' taxonomy-editor/Dockerfile | head -1)
          BASE_TAG="${BASE_TAG%% *}"
          echo "Base image tag: $BASE_TAG"
          if [ "$BASE_TAG" = "latest" ]; then
            echo "Using :latest — checking it exists..."
          fi
          TAGS=$(gh api user/packages/container/ai-triad-base/versions --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          if echo "$TAGS" | grep -qx "$BASE_TAG"; then
            echo "Base image ghcr.io/jpsnover/ai-triad-base:$BASE_TAG exists"
          else
            echo "::error::Base image tag '$BASE_TAG' not found in GHCR. Available tags: $(echo $TAGS | tr '\n' ', ')"
            echo "Run the base-image workflow first, or update the Dockerfile to use an existing tag."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Fetch taxonomy snapshot for fallback
        id: snapshot
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "Fetching taxonomy snapshot from ai-triad-data for baked fallback..."
          $Result = Get-TaxonomySnapshot -OutputPath taxonomy-snapshot

          if ($Result.Valid) {
            $TotalSize = (Get-ChildItem -Path taxonomy-snapshot -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host "Snapshot fetched successfully ($([math]::Round($TotalSize / 1MB, 1)) MB)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=true"
          } else {
            foreach ($f in $Result.MissingRequired) {
              Write-Host "::warning::Required file $f is missing or empty"
            }
            Write-Host "::warning::$($Result.MissingRequired.Count) required taxonomy files missing — fallback will be incomplete"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "valid=false"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure snapshot directory exists
        if: always()
        run: |
          # Guarantee taxonomy-snapshot/ exists for the Dockerfile COPY layer.
          # If the fetch step was skipped or failed, create a minimal stub
          # so the build succeeds (fallback will just be empty).
          mkdir -p taxonomy-snapshot
          if [ ! -f taxonomy-snapshot/snapshot-meta.json ]; then
            echo '{"generated":"none","commit":"none","empty":true}' > taxonomy-snapshot/snapshot-meta.json
          fi

      - name: Determine push mode
        id: push_mode
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.push }}" == "true" ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
            echo "load=false" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "load=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: taxonomy-editor/Dockerfile
          push: ${{ steps.push_mode.outputs.push }}
          load: ${{ steps.push_mode.outputs.load }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shared-docker
          cache-to: type=gha,scope=shared-docker,mode=min

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Attest build provenance
        if: steps.push_mode.outputs.push == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Image size report
        if: success()
        run: docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
