# ─── CodeQL SAST ───
# What:  Static application security testing for TypeScript/JavaScript using
#        GitHub CodeQL with security-extended queries (OWASP Top 10 coverage).
# Before: Triggers on push/PR to main for TS/JS files, plus weekly Monday scan.
#         No manual setup needed.
# After:  SARIF results appear in the GitHub Security tab. Review any new alerts
#         and fix high-severity findings before merging.

name: CodeQL SAST

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
  pull_request:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
  schedule:
    # Weekly scan — catches new CVE patterns even without code changes
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          languages: javascript-typescript
          # Security-extended covers OWASP Top 10 + additional patterns
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4
        with:
          category: '/language:javascript-typescript'
          # SARIF uploaded to GitHub Security tab automatically
