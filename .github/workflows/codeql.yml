# ─── CodeQL SAST ───
# What:  Static application security testing for TypeScript/JavaScript using
#        GitHub CodeQL with security-extended queries (OWASP Top 10 coverage).
# Before: Triggers on TS/JS pushes to main, on EVERY pull_request to main (no
#         path filter, so the differential check-run always reports — t/2025),
#         plus weekly Monday scan. No manual setup needed.
# After:  SARIF results appear in the GitHub Security tab. Review any new alerts
#         and fix high-severity findings before merging.

name: CodeQL SAST

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
  pull_request:
    # No path filter on PRs (t/2025): CodeQL must run on EVERY PR so the
    # differential code-scanning check-run always reports. Once that check is a
    # REQUIRED status context, a path-filtered PR that never triggered CodeQL
    # would strand — the required check would sit pending forever (t/1962 genus).
    branches: [main]
  schedule:
    # Weekly scan — catches new CVE patterns even without code changes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── record-base-ref (t/3687): retarget stale-green guard sink ──────────────
  # Records the base ref NAME this workflow ran against as a commit STATUS, so the
  # pre-self-merge merge-guard can detect a base RETARGET after CI (base-ref-name
  # identity — timestamps and merge-SHA both failed; see merge-guard-predicate.mjs).
  # DIAGNOSTIC ONLY — this status must NEVER be added to required contexts (TL p/331):
  # that would turn a diagnostic into a merge blocker nobody designed. Scoped token
  # (statuses:write only). Posts to the PR HEAD sha, NOT github.sha — on pull_request
  # github.sha is the merge commit, which GitHub rebuilds when main advances (the merge-SHA
  # trap, t/3687), orphaning the status for exactly the long-lived PRs the guard protects.
  # Gated to pull_request (on push, github.base_ref is empty).
  record-base-ref:
    name: Record base ref (t/3687)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post base-ref-record commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="base-ref-record/codeql.yml" \
            -f description="${BASE_REF}"

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          languages: javascript-typescript
          # queries (security-extended) + the test/archive paths-ignore live in the
          # config file so the scan scope is in one place (t/2025).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          category: '/language:javascript-typescript'
          # SARIF uploaded to GitHub Security tab automatically
