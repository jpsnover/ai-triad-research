# ─── Taxonomy Version Reminder ───
# What:  Posts a PR comment reminding authors to bump TAXONOMY_VERSION when
#        taxonomy/Origin/ files are modified. Advisory only — does not block merge.
# Before: Triggers automatically on PRs that touch taxonomy/Origin/ files.
# After:  If TAXONOMY_VERSION was not bumped, a comment explains the MAJOR/MINOR/PATCH
#         semantics. Authors should bump the version if the change warrants it.

name: Taxonomy Version Reminder

on:
  pull_request:
    paths:
      - 'taxonomy/Origin/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Check if TAXONOMY_VERSION was updated
        id: version_check
        run: |
          CHANGED=$(git diff origin/main...HEAD --name-only)
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -q "taxonomy/Origin/"; then
            if echo "$CHANGED" | grep -q "TAXONOMY_VERSION"; then
              echo "bumped=true" >> $GITHUB_OUTPUT
            else
              echo "bumped=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Warn if version not bumped
        if: steps.version_check.outputs.bumped == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ **Taxonomy Version Reminder**\n\nThis PR modifies `taxonomy/` files but does not update `TAXONOMY_VERSION`.\n\nIf this change affects node meaning (MINOR) or structure (MAJOR), please bump `TAXONOMY_VERSION` before merging so the batch summarization script knows to reprocess affected documents.\n\nPATCH changes (typo fixes) do not require a version bump — reviewer discretion applies."
            })
