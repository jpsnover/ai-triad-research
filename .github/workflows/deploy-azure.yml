# ─── Deploy to Azure ───
# What:  Blue-green production deployment to Azure Container Apps via Bicep.
#        Deploys new revision at 0% traffic, health checks, then shifts to 100%.
#        Auto-rollback on health failure.
# Before: Container image must exist in GHCR (run Container Image workflow first).
#         Requires AZURE_* OIDC secrets and OAuth secrets configured.
# After:  Verify the app is healthy at the production URL. Check Azure Log Analytics
#         for any startup errors. Monitor costs against the $5/month target.

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Image tag to deploy (e.g., 0.8.0). Leave empty for latest tagged version.'
        required: false
        default: ''
        type: string
      auth_mode:
        description: 'Authentication mode: optional (login + anonymous read-only), required (must sign in), disabled (no auth)'
        required: true
        default: 'optional'
        type: choice
        options:
          - optional
          - required
          - disabled
      # enable_git_sync removed — GitHub API-first mode is always on (STORAGE_MODE=github-api)

permissions:
  contents: read
  packages: read
  id-token: write  # For Azure OIDC login

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taxonomy-editor
  RESOURCE_GROUP: ai-triad
  CONTAINER_APP_NAME: taxonomy-editor

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Resolve image tag
        id: resolve_tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "tag=$INPUT_IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking CI status for ${{ github.sha }}..."
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || echo "")
          if [ "$CONCLUSION" = "success" ]; then
            echo "CI passed for this commit"
          elif [ -z "$CONCLUSION" ]; then
            echo "::error::No CI run found for commit ${{ github.sha }}. CI must pass before deploying."
            exit 1
          else
            echo "::error::CI status is '$CONCLUSION' for commit ${{ github.sha }}. CI must pass before deploying."
            exit 1
          fi

      - name: Verify container image exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          echo "Checking for image ghcr.io/${{ github.repository_owner }}/taxonomy-editor:$TAG..."
          TAGS=$(gh api user/packages/container/taxonomy-editor/versions \
            --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          if echo "$TAGS" | grep -qx "$TAG"; then
            echo "Container image tag '$TAG' exists in GHCR"
          else
            echo "::error::Container image tag '$TAG' not found in GHCR. Run the Container Image workflow first."
            echo "Available tags: $(echo $TAGS | head -5 | tr '\n' ', ')"
            exit 1
          fi

  deploy:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Resolve image tag
        id: resolve_tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "tag=$INPUT_IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            # Use the git tag name if triggered from a tag context, else 'latest'
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "::warning::No explicit tag provided and not on a version ref — falling back to 'latest'"
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Deploying image tag: $(cat $GITHUB_OUTPUT | grep tag= | cut -d= -f2)"

      - name: Log in to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview Bicep changes (what-if)
        run: |
          echo "Previewing infrastructure changes..."
          RESULT=$(az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deploy/azure/main.bicep \
            --parameters \
              containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }} \
              googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }} \
              githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }} \
              authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }} \
              authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }} \
              adminUsers=${{ vars.ADMIN_USERS }} \
              aadClientId=${{ secrets.AAD_CLIENT_ID }} \
              aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }} \
              aadIssuer=common \
              gitSyncEnabled=1 \
              githubRepo=${{ vars.SYNC_GITHUB_REPO }} \
              githubAppId=${{ vars.SYNC_GITHUB_APP_ID }} \
              githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }} \
              githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }} \
              githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }} \
              freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }} \
            --no-pretty-print 2>&1) || true
          echo "$RESULT"

          # Fail on unexpected deletes (but allow NoChange and Modify)
          if echo "$RESULT" | grep -q '"changeType":"Delete"'; then
            echo "::error::Bicep what-if detected resource DELETIONS — review before deploying"
            exit 1
          fi

      - name: Deploy Bicep template
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5  # v2
        id: deploy
        with:
          # Bicep emits compile warnings (e.g. BCP422/BCP318 from runner.bicep)
          # to stderr. arm-deploy defaults failOnStdErr:true, which would fail
          # this step on those warnings even though the ARM deployment succeeds —
          # masking real failures and skipping the blue-green / DEPLOY_SHA steps
          # below. Tolerate stderr; real deploy failures still surface via the
          # action's non-zero exit. (t/702)
          failOnStdErr: false
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: deploy/azure/main.bicep
          parameters: >-
            containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }}
            googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }}
            githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
            authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }}
            authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }}
            adminUsers=${{ vars.ADMIN_USERS }}
            aadClientId=${{ secrets.AAD_CLIENT_ID }}
            aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }}
            aadIssuer=common
            gitSyncEnabled=1
            githubRepo=${{ vars.SYNC_GITHUB_REPO }}
            githubAppId=${{ vars.SYNC_GITHUB_APP_ID }}
            githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }}
            githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }}
            githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }}
            freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }}

      - name: Get current active revision
        id: current_revision
        run: |
          CURRENT=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.trafficWeight > \`0\`].name | [0]" -o tsv)
          echo "revision=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current active revision: $CURRENT"

      - name: Cleanup stale revisions
        run: |
          echo "Deactivating stale revisions to free resources..."
          ACTIVE="${{ steps.current_revision.outputs.revision }}"
          STALE=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.active && properties.trafficWeight == \`0\`].name" -o tsv)
          for rev in $STALE; do
            if [ "$rev" != "$ACTIVE" ]; then
              echo "  Deactivating: $rev"
              az containerapp revision deactivate \
                --name ${{ env.CONTAINER_APP_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --revision "$rev" 2>/dev/null || true
            fi
          done
          echo "Cleanup complete"

      - name: Deploy new revision (0% traffic)
        id: new_revision
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SUFFIX="deploy-${SHORT_SHA}-$(date +%s | tail -c 5)"
          NEW_REV="${{ env.CONTAINER_APP_NAME }}--${SUFFIX}"

          # Deploy new revision — in Multiple mode it starts with 0% traffic
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }} \
            --revision-suffix "$SUFFIX" \
            --set-env-vars "DEPLOY_SHA=${{ github.sha }}" "DEPLOY_TAG=${{ steps.resolve_tag.outputs.tag }}"

          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "revision=$NEW_REV" >> $GITHUB_OUTPUT

      - name: Health check new revision
        id: health_check
        run: |
          # Get the revision-specific FQDN to test the new revision directly
          REV_FQDN=$(az containerapp revision show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${{ steps.new_revision.outputs.revision }}" \
            --query "properties.fqdn" -o tsv 2>/dev/null || echo "")

          if [ -z "$REV_FQDN" ]; then
            BASE_URL="${{ steps.deploy.outputs.appUrl }}"
          else
            BASE_URL="https://${REV_FQDN}"
          fi
          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT

          # ── Phase 1: Server started ──
          # /health returns 200 once Node.js is listening.
          # 30 attempts × 10s = 5 min. --max-time 15 prevents Envoy 504 gateway
          # timeouts (~4min each) from turning a 5-minute check into a 2-hour wait.
          echo "Phase 1: checking $BASE_URL/health ..."
          HEALTHY="false"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --connect-timeout 5 "$BASE_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Phase 1 passed — server is up"
              HEALTHY="true"
              break
            fi
            echo "  Waiting for container to start... (attempt $i/30, status: $STATUS)"
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "::error::Phase 1 failed — server did not start within 5 minutes"
            exit 0
          fi

          # ── Phase 2: Data loaded ──
          # /healthz returns 503 when taxonomy data isn't available. A deploy where
          # the container starts but can't read data is broken — catch it here before
          # traffic shifts. 12 attempts × 10s = 2 min for GitHub API initial fetch.
          echo "Phase 2: checking $BASE_URL/healthz (data availability)..."
          for i in $(seq 1 12); do
            HZ_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/healthz" || echo "000")
            if [ "$HZ_STATUS" = "200" ]; then
              echo "Phase 2 passed — taxonomy data loaded"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  Data not ready (attempt $i/12, /healthz: $HZ_STATUS)"
            sleep 10
          done

          echo "healthy=false" >> $GITHUB_OUTPUT
          echo "::error::Phase 2 failed — server started but taxonomy data not loaded after 2 minutes"

      - name: Acceptance tests (pre-traffic shift)
        id: acceptance
        if: steps.health_check.outputs.healthy == 'true'
        run: |
          BASE_URL="${{ steps.health_check.outputs.base_url }}"
          echo "=== Acceptance tests against 0% revision: $BASE_URL ==="
          echo ""
          PASS=0; FAIL=0; ERRORS=""

          # AUTH_OPTIONAL mode requires an anonymous session cookie for
          # non-public endpoints. Establish it once, reuse for all checks.
          COOKIE_JAR=$(mktemp)
          curl -s -o /dev/null -c "$COOKIE_JAR" -L --max-time 10 "${BASE_URL}/.auth/anonymous" 2>/dev/null || true

          # check LABEL URL [BODY_REGEX]
          # Verifies HTTP 200 and optionally that the body matches a regex
          check() {
            local label=$1 url=$2 expect_body=$3
            BODY=$(curl -s -b "$COOKIE_JAR" --max-time 15 --connect-timeout 5 "$url" 2>/dev/null || echo "")
            STATUS=$(curl -s -b "$COOKIE_JAR" -o /dev/null -w "%{http_code}" --max-time 15 --connect-timeout 5 "$url" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              if [ -n "$expect_body" ]; then
                if echo "$BODY" | grep -qE "$expect_body"; then
                  PASS=$((PASS + 1))
                  echo "  PASS  $label"
                else
                  FAIL=$((FAIL + 1))
                  ERRORS="${ERRORS}$label: body did not match '$expect_body' (got: $(echo "$BODY" | head -c 120))\n"
                  echo "  FAIL  $label — body mismatch"
                fi
              else
                PASS=$((PASS + 1))
                echo "  PASS  $label"
              fi
            else
              FAIL=$((FAIL + 1))
              ERRORS="${ERRORS}$label: HTTP $STATUS\n"
              echo "  FAIL  $label (HTTP $STATUS)"
            fi
          }

          # ── 1. Infrastructure ──
          echo "--- Infrastructure ---"
          check "health" "${BASE_URL}/health" '"status"'
          check "liveness" "${BASE_URL}/healthz"
          check "data available" "${BASE_URL}/api/data/available" "true"

          # ── 2. Taxonomy viewer (core user workflow) ──
          echo ""
          echo "--- Taxonomy viewer ---"
          check "accelerationist POV" "${BASE_URL}/api/taxonomy/accelerationist" '"nodes"'
          check "safetyist POV" "${BASE_URL}/api/taxonomy/safetyist" '"nodes"'
          check "skeptic POV" "${BASE_URL}/api/taxonomy/skeptic" '"nodes"'
          check "edges/relationships" "${BASE_URL}/api/edges" '\['
          check "policy registry" "${BASE_URL}/api/policy-registry" '"pol-'
          check "conflicts" "${BASE_URL}/api/conflicts" '\['

          # ── 3. AI readiness (keys configured for debate/chat) ──
          echo ""
          echo "--- AI readiness ---"
          # /api/keys/has requires sign-in — AI features are gated for anonymous
          # users — so it 403s under this anonymous acceptance session and is not a
          # valid readiness signal here. Platform Gemini-key readiness is verified
          # auth-free via /health geminiKeyConfigured below.
          check "health AI status" "${BASE_URL}/health" '"geminiKeyConfigured"'

          # ── 4. Debate & chat (can list, even if no sessions exist) ──
          echo ""
          echo "--- Debate & chat ---"
          check "debate listing" "${BASE_URL}/api/debates/list"
          check "chat listing" "${BASE_URL}/api/chats"

          # ── 5. Community library ──
          echo ""
          echo "--- Community ---"
          check "community debates" "${BASE_URL}/api/community/debates"

          # ── 6. Reference data ──
          echo ""
          echo "--- Reference data ---"
          check "AI models" "${BASE_URL}/api/models"
          check "lineage categories" "${BASE_URL}/api/lineage-categories"

          # ── 7. Sync & auth ──
          echo ""
          echo "--- Sync & auth ---"
          check "sync status" "${BASE_URL}/api/sync/status" '"enabled"'
          check "auth endpoint" "${BASE_URL}/api/auth/me"

          # ── 8. SPA renders ──
          echo ""
          echo "--- Frontend ---"
          MAIN_PAGE=$(curl -s -b "$COOKIE_JAR" --max-time 15 "${BASE_URL}/" 2>/dev/null || echo "")
          if echo "$MAIN_PAGE" | grep -q '<div id="root"'; then
            # Verify JS bundle is referenced (not just empty HTML shell)
            if echo "$MAIN_PAGE" | grep -qE 'src="[^"]*\.js"'; then
              PASS=$((PASS + 1))
              echo "  PASS  SPA shell + JS bundle"
            else
              FAIL=$((FAIL + 1))
              ERRORS="${ERRORS}SPA: root div present but no JS bundle reference\n"
              echo "  FAIL  SPA — no JS bundle"
            fi
          else
            FAIL=$((FAIL + 1))
            ERRORS="${ERRORS}SPA: <div id=\"root\"> not found in HTML\n"
            echo "  FAIL  SPA shell not found"
          fi

          # ── Summary ──
          rm -f "$COOKIE_JAR"
          echo ""
          echo "--- Health detail ---"
          curl -s --max-time 10 "${BASE_URL}/health" \
            | jq '{version, uptime, storage, github: {rateLimit: .github.rateLimit, circuitState: .github.circuitState}}' \
            2>/dev/null || echo "(no structured health)"

          echo ""
          echo "=== Acceptance: $PASS passed, $FAIL failed ==="

          if [ "$FAIL" -gt 0 ]; then
            echo "accepted=false" >> $GITHUB_OUTPUT
            echo ""
            echo "::error::Acceptance tests failed — NOT shifting traffic"
            printf "Failures:\n$ERRORS"
          else
            echo "accepted=true" >> $GITHUB_OUTPUT
          fi

      - name: Shift traffic to new revision
        if: steps.health_check.outputs.healthy == 'true' && steps.acceptance.outputs.accepted == 'true'
        run: |
          echo "New revision healthy — waiting for provisioning to settle..."
          sleep 30

          for attempt in 1 2 3 4 5; do
            if az containerapp ingress traffic set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --revision-weight "${{ steps.new_revision.outputs.revision }}=100" 2>&1; then
              echo "Traffic shifted to ${{ steps.new_revision.outputs.revision }}"
              exit 0
            fi
            echo "Traffic shift attempt $attempt/5 failed (provisioning in progress) — retrying in 30s..."
            sleep 30
          done
          echo "::error::Traffic shift failed after 5 attempts"
          exit 1

      - name: Collect failure diagnostics
        if: steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false'
        run: |
          echo "=== Revision Status ==="
          az containerapp revision show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${{ steps.new_revision.outputs.revision }}" \
            --query "{state:properties.runningState,health:properties.healthState,replicas:properties.replicas,reason:properties.statusMessage}" \
            -o table 2>/dev/null || echo "(revision not found)"

          echo ""
          echo "=== Container Console Logs (last 100 lines) ==="
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${{ steps.new_revision.outputs.revision }}" \
            --type console --tail 100 2>/dev/null || echo "(no console logs)"

          echo ""
          echo "=== System Events (last 50) ==="
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type system --tail 50 2>/dev/null || echo "(no system logs)"

      - name: Re-authenticate before rollback
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false') && steps.current_revision.outputs.revision != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback on failure
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false') && steps.current_revision.outputs.revision != ''
        run: |
          echo "::error::New revision unhealthy — rolling back to ${{ steps.current_revision.outputs.revision }}"
          # Deactivate the failed revision
          az containerapp revision deactivate \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${{ steps.new_revision.outputs.revision }}" || true
          # Ensure previous revision keeps 100% traffic
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision-weight "${{ steps.current_revision.outputs.revision }}=100"
          echo "Rollback complete. Previous revision restored."
          exit 1

      - name: Fail if unhealthy (no previous revision to rollback to)
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false') && steps.current_revision.outputs.revision == ''
        run: |
          echo "::error::Health check failed and no previous revision exists for rollback"
          exit 1

      - name: Post-deploy verification (traffic shifted)
        if: steps.acceptance.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          APP_URL="${{ steps.deploy.outputs.appUrl }}"
          PASS=0; FAIL=0

          check() {
            local label=$1 url=$2 validate=$3
            BODY=$(curl -s --max-time 10 --connect-timeout 5 "$url" 2>/dev/null)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "$url" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              PASS=$((PASS + 1))
              echo "  ✓ $label ($STATUS)"
              if [ -n "$validate" ]; then
                echo "    $BODY" | head -c 200
                echo ""
              fi
            else
              FAIL=$((FAIL + 1))
              echo "  ✗ $label ($STATUS)"
            fi
          }

          echo "=== Post-deploy smoke test ==="
          echo ""

          echo "--- Health & liveness ---"
          check "/health" "${APP_URL}/health"
          check "/healthz" "${APP_URL}/healthz"
          check "/api/data/available" "${APP_URL}/api/data/available" show

          echo ""
          echo "--- API layer ---"
          check "/api/models" "${APP_URL}/api/models" show
          check "/api/auth/me" "${APP_URL}/api/auth/me" show
          check "/api/user/profile" "${APP_URL}/api/user/profile" show

          echo ""
          echo "--- Health detail ---"
          curl -s --max-time 10 "${APP_URL}/health" \
            | jq '{version, uptime, storage, github: {rateLimit: .github.rateLimit, circuitState: .github.circuitState}, flightRecorder}' \
            2>/dev/null || echo "(no structured health)"

          echo ""
          echo "=== Smoke test results: $PASS passed, $FAIL failed ==="

      - name: Cleanup stale registry credentials
        if: steps.acceptance.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          # The GHCR package is public — no registry credentials needed.
          # Stale credentials (expired PATs) cause ImagePullBackOff on node rotation.
          # ARM API won't remove registries referenced by active revisions, so we
          # first deactivate old revisions, then remove the registry + secret.
          echo "Deactivating old revisions..."
          OLD_REV="${{ steps.current_revision.outputs.revision }}"
          if [ -n "$OLD_REV" ]; then
            az containerapp revision deactivate \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --revision "$OLD_REV" 2>/dev/null || true
            echo "  Deactivated: $OLD_REV"
          fi

          echo "Removing stale GHCR registry credential (if present)..."
          if az containerapp registry show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ghcr.io 2>/dev/null | grep -q ghcr.io; then
            az containerapp registry remove \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ghcr.io 2>/dev/null || echo "  (registry remove failed — may still be referenced)"
            az containerapp secret remove \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secret-names ghcr-password 2>/dev/null || echo "  (secret remove failed — may still be referenced)"
            echo "  GHCR cleanup attempted"
          else
            echo "  No GHCR registry configured — nothing to clean"
          fi
