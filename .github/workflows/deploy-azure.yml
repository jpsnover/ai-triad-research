# ─── Deploy to Azure ───
# What:  Blue-green production deployment to Azure Container Apps via Bicep.
#        Deploys new revision at 0% traffic, health checks, then shifts to 100%.
#        Auto-rollback on health failure.
# Before: Container image must exist in GHCR (run Container Image workflow first).
#         Requires AZURE_* OIDC secrets and OAuth secrets configured.
# After:  Verify the app is healthy at the production URL. Check Azure Log Analytics
#         for any startup errors. Monitor costs against the $5/month target.

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Image tag to deploy (e.g., 0.8.0). Leave empty for latest tagged version.'
        required: false
        default: ''
        type: string
      auth_mode:
        description: 'Authentication mode: optional (login + anonymous read-only), required (must sign in), disabled (no auth)'
        required: true
        default: 'optional'
        type: choice
        options:
          - optional
          - required
          - disabled
      # enable_git_sync removed — GitHub API-first mode is always on (STORAGE_MODE=github-api)

permissions:
  contents: read
  packages: read
  id-token: write  # For Azure OIDC login

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taxonomy-editor
  RESOURCE_GROUP: ai-triad
  CONTAINER_APP_NAME: taxonomy-editor

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Resolve image tag
        id: resolve_tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "tag=$INPUT_IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Verify container-relevant CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking CI status for ${{ github.sha }}..."

          # Get the latest CI run for this commit
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || echo "")

          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run found for commit ${{ github.sha }}. CI must run before deploying."
            exit 1
          fi

          # Check only test-container — it needs: [test-powershell, test-electron]
          # so if it passed, all upstream jobs passed too. Checking test-electron
          # by name fails because the matrix creates per-app jobs (e.g. "test-electron (taxonomy-editor)").
          for JOB in test-container; do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
              --jq ".jobs[] | select(.name == \"${JOB}\") | .conclusion // .status" 2>/dev/null || echo "")
            if [ "$STATUS" = "success" ]; then
              echo "  ${JOB}: passed"
            elif [ -z "$STATUS" ]; then
              echo "::error::Job '${JOB}' not found in CI run ${RUN_ID}."
              exit 1
            elif [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
              echo "::error::Job '${JOB}' is still ${STATUS} in CI run ${RUN_ID}. Wait for it to complete."
              exit 1
            else
              echo "::error::Job '${JOB}' status is '${STATUS}' in CI run ${RUN_ID}. Container-relevant CI must pass before deploying."
              exit 1
            fi
          done
          echo "Container-relevant CI passed for this commit"

      - name: Verify container image exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Tag = "${{ steps.resolve_tag.outputs.tag }}"
          Write-Host "Checking for image ghcr.io/${{ github.repository_owner }}/taxonomy-editor:$Tag..."
          $Images = Get-TaxEditorImage -Last 100
          $AllTags = @($Images | ForEach-Object { $_.Tags })
          if ($AllTags -contains $Tag) {
            Write-Host "Container image tag '$Tag' exists in GHCR"
          } else {
            Write-Host "::error::Container image tag '$Tag' not found in GHCR. Run the Container Image workflow first."
            Write-Host "Available tags: $(($AllTags | Select-Object -First 5) -join ', ')"
            exit 1
          }

  deploy:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Resolve image tag
        id: resolve_tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "tag=$INPUT_IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            # Use the git tag name if triggered from a tag context, else 'latest'
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "tag=$TAG" >> $GITHUB_OUTPUT
            else
              echo "::warning::No explicit tag provided and not on a version ref — falling back to 'latest'"
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Deploying image tag: $(cat $GITHUB_OUTPUT | grep tag= | cut -d= -f2)"

      - name: Log in to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview Bicep changes (what-if)
        run: |
          echo "Previewing infrastructure changes..."
          RESULT=$(az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deploy/azure/main.bicep \
            --parameters \
              containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }} \
              googleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }} \
              githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }} \
              authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }} \
              authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }} \
              adminUsers=${{ vars.ADMIN_USERS }} \
              aadClientId=${{ secrets.AAD_CLIENT_ID }} \
              aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }} \
              aadIssuer=common \
              gitSyncEnabled=1 \
              githubRepo=${{ vars.SYNC_GITHUB_REPO }} \
              githubAppId=${{ vars.SYNC_GITHUB_APP_ID }} \
              githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }} \
              githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }} \
              githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }} \
              freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }} \
              geminiPaidKey=${{ secrets.GEMINI_PAID_KEY }} \
              budgetAlertEmail=${{ vars.ALERT_EMAIL }} \
            --no-pretty-print 2>&1) || true
          echo "$RESULT"

          # Fail on unexpected deletes (but allow NoChange and Modify)
          if echo "$RESULT" | grep -q '"changeType":"Delete"'; then
            echo "::error::Bicep what-if detected resource DELETIONS — review before deploying"
            exit 1
          fi

      - name: Deploy Bicep template
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5  # v2
        id: deploy
        with:
          # Bicep emits compile warnings (e.g. BCP422/BCP318 from runner.bicep)
          # to stderr. arm-deploy defaults failOnStdErr:true, which would fail
          # this step on those warnings even though the ARM deployment succeeds —
          # masking real failures and skipping the blue-green / DEPLOY_SHA steps
          # below. Tolerate stderr; real deploy failures still surface via the
          # action's non-zero exit. (t/702)
          failOnStdErr: false
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: deploy/azure/main.bicep
          parameters: >-
            containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }}
            googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            githubClientId=${{ secrets.GH_OAUTH_CLIENT_ID }}
            githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
            authDisabled=${{ inputs.auth_mode == 'disabled' && '1' || '' }}
            authOptional=${{ inputs.auth_mode == 'optional' && '1' || '' }}
            adminUsers=${{ vars.ADMIN_USERS }}
            aadClientId=${{ secrets.AAD_CLIENT_ID }}
            aadClientSecret=${{ secrets.AAD_CLIENT_SECRET }}
            aadIssuer=common
            gitSyncEnabled=1
            githubRepo=${{ vars.SYNC_GITHUB_REPO }}
            githubAppId=${{ vars.SYNC_GITHUB_APP_ID }}
            githubAppInstallationId=${{ vars.SYNC_GITHUB_APP_INSTALLATION_ID }}
            githubAppPrivateKeySecretName=${{ vars.SYNC_GITHUB_APP_PRIVATE_KEY_SECRET_NAME }}
            githubWebhookSecret=${{ secrets.SYNC_GITHUB_WEBHOOK_SECRET }}
            freeTierGeminiKey=${{ secrets.FREE_TIER_GEMINI_KEY }}
            geminiPaidKey=${{ secrets.GEMINI_PAID_KEY }}
            budgetAlertEmail=${{ vars.ALERT_EMAIL }}

      - name: Get current active revision
        id: current_revision
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Rev = Get-ContainerAppRevision -Mode Active `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          $RevName = if ($Rev) { $Rev.Name } else { '' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "revision=$RevName"
          Write-Host "Current active revision: $RevName"

      - name: Cleanup stale revisions
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "Deactivating stale revisions to free resources..."
          $Stale = @(Get-ContainerAppRevision -Mode Stale `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}')
          foreach ($Rev in $Stale) {
            Disable-ContainerAppRevision -RevisionName $Rev.Name `
              -AppName '${{ env.CONTAINER_APP_NAME }}' `
              -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          }
          Write-Host "Cleanup complete"

      - name: Deploy new revision (0% traffic)
        id: new_revision
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $ShortSha = '${{ github.sha }}'.Substring(0, 7)
          $Epoch = ([string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()))[-5..-1] -join ''
          $Suffix = "deploy-$ShortSha-$Epoch"
          $Result = New-ContainerAppRevision `
            -ImageRef '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve_tag.outputs.tag }}' `
            -RevisionSuffix $Suffix `
            -EnvVars @{ DEPLOY_SHA = '${{ github.sha }}'; DEPLOY_TAG = '${{ steps.resolve_tag.outputs.tag }}' } `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "suffix=$Suffix"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "revision=$($Result.RevisionName)"

      - name: Health check new revision
        id: health_check
        shell: pwsh
        run: |
          # Get the revision-specific FQDN to test the new revision directly
          $RevInfo = Get-ContainerAppRevision -Mode Fqdn `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          $RevFqdn = if ($RevInfo) { $RevInfo.Fqdn } else { $null }

          $BaseUrl = if ([string]::IsNullOrWhiteSpace($RevFqdn)) { "${{ steps.deploy.outputs.appUrl }}" } else { "https://$RevFqdn" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "base_url=$BaseUrl"

          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          # Unified check (t/1495): server-up (/health) and data-loaded (/healthz)
          # in one probe per attempt, instead of two sequential phases with
          # separate budgets. 42 attempts x 10s = 7 min, matching the prior
          # combined worst-case budget (5 min server-start + 2 min data-load).
          # -TimeoutSec 15 preserves the original curl --max-time 15 protection
          # against Envoy 504 gateway hangs turning this into a multi-hour wait.
          $Result = Test-TaxEditorHealth -BaseUrl $BaseUrl -TimeoutSec 15 -MaxAttempts 42 -RetryIntervalSec 10

          if ($Result.Healthy) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=true"
            Write-Host "Health check passed — server up and taxonomy data loaded"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "healthy=false"
            $ServerCheck = $Result.Checks | Where-Object { $_.Endpoint -eq '/health' }
            $DataCheck = $Result.Checks | Where-Object { $_.Endpoint -eq '/healthz' }
            if (-not $ServerCheck.Healthy) {
              Write-Host "::error::Server-up check failed — /health did not return ok within 7 minutes ($($ServerCheck.Detail))"
            } elseif (-not $DataCheck.Healthy) {
              Write-Host "::error::Data-loaded check failed — /healthz did not return healthy within 7 minutes ($($DataCheck.Detail))"
            } else {
              Write-Host "::error::Health check failed for an unexpected reason"
            }
          }

      - name: Acceptance tests (pre-traffic shift)
        id: acceptance
        if: steps.health_check.outputs.healthy == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $BaseUrl = '${{ steps.health_check.outputs.base_url }}'
          Write-Host "=== Acceptance tests against 0% revision: $BaseUrl ==="
          $Results = @(Test-TaxEditorEndpoints -BaseUrl $BaseUrl -AnonymousSession)
          $Fails = @($Results | Where-Object { -not $_.Pass })
          $Results | Format-Table Endpoint, Pass, StatusCode, Detail -AutoSize
          Write-Host ""
          Write-Host "=== Acceptance: $($Results.Count - $Fails.Count) passed, $($Fails.Count) failed ==="
          if ($Fails.Count -gt 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=false'
            Write-Host "::error::Acceptance tests failed — NOT shifting traffic"
            foreach ($F in $Fails) { Write-Host "  FAIL  $($F.Endpoint): $($F.Detail)" }
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=true'
          }

      - name: Persona matrix (pre-traffic shift)
        id: persona
        if: steps.health_check.outputs.healthy == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $BaseUrl = "${{ steps.health_check.outputs.base_url }}"
          $Results = Test-PersonaEndpoints -BaseUrl $BaseUrl -Detailed
          $Fails = @($Results | Where-Object { -not $_.Pass -and -not $_.Note })

          if ($Fails.Count -gt 0) {
            Write-Host "::error::Persona matrix: $($Fails.Count) real auth-gate regression(s) — NOT shifting traffic"
            foreach ($F in $Fails) {
              Write-Host "  FAIL  persona=$($F.Persona) $($F.Method) $($F.Endpoint) expected=$($F.ExpectedAccess) actual=$($F.ActualAccess) status=$($F.StatusCode)"
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=false'
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'accepted=true'
          }

      - name: Shift traffic to new revision
        if: steps.health_check.outputs.healthy == 'true' && steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "New revision healthy — waiting for provisioning to settle..."
          Start-Sleep -Seconds 30
          $Result = Set-ContainerAppTraffic `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}' `
            -MaxAttempts 5 `
            -RetryIntervalSec 30
          Write-Host "Traffic shifted to ${{ steps.new_revision.outputs.revision }} after $($Result.AttemptCount) attempt(s)"

      - name: Collect failure diagnostics
        if: steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false'
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $Diag = Get-ContainerAppDiagnostics `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          Write-Host '=== Revision Status ==='
          $Diag.RevisionState | Format-Table -AutoSize
          Write-Host ''
          Write-Host '=== Container Console Logs (last 100 lines) ==='
          if ($Diag.ConsoleLogs) { $Diag.ConsoleLogs | ForEach-Object { Write-Host $_ } }
          else { Write-Host '(no console logs available)' }
          Write-Host ''
          Write-Host '=== System Events ==='
          if ($Diag.SystemLogs) { $Diag.SystemLogs | ForEach-Object { Write-Host $_ } }
          else { Write-Host '(no system logs available)' }

      - name: Re-authenticate before rollback
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false') && steps.current_revision.outputs.revision != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback on failure
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false') && steps.current_revision.outputs.revision != ''
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          Write-Host "::error::New revision unhealthy — rolling back to ${{ steps.current_revision.outputs.revision }}"
          # TL note 4: traffic-shift BEFORE deactivate — shift failure is recoverable; deactivate-then-shift is not
          Set-ContainerAppTraffic `
            -RevisionName '${{ steps.current_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}' `
            -MaxAttempts 3 `
            -RetryIntervalSec 10
          Disable-ContainerAppRevision `
            -RevisionName '${{ steps.new_revision.outputs.revision }}' `
            -AppName '${{ env.CONTAINER_APP_NAME }}' `
            -ResourceGroup '${{ env.RESOURCE_GROUP }}'
          Write-Host "Rollback complete. Previous revision restored."
          exit 1

      - name: Fail if unhealthy (no previous revision to rollback to)
        if: (steps.health_check.outputs.healthy != 'true' || steps.acceptance.outputs.accepted == 'false' || steps.persona.outputs.accepted == 'false') && steps.current_revision.outputs.revision == ''
        run: |
          echo "::error::Health check failed and no previous revision exists for rollback"
          exit 1

      - name: Post-deploy verification (traffic shifted)
        if: steps.acceptance.outputs.accepted == 'true' && steps.persona.outputs.accepted == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./scripts/AITriad/AITriad.psm1 -Force
          $AppUrl = '${{ steps.deploy.outputs.appUrl }}'
          Write-Host "=== Post-deploy smoke test against $AppUrl ==="
          $Results = @(Test-TaxEditorEndpoints -BaseUrl $AppUrl)
          $Fails = @($Results | Where-Object { -not $_.Pass })
          $Results | Format-Table Endpoint, Pass, StatusCode -AutoSize
          Write-Host ""
          Write-Host "=== Smoke test results: $($Results.Count - $Fails.Count) passed, $($Fails.Count) failed ==="
          if ($Fails.Count -gt 0) {
            Write-Host "::warning::Post-deploy smoke had $($Fails.Count) failure(s) — app is live but some endpoints may need attention"
          }

