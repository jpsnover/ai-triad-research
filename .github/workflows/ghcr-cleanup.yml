# ─── GHCR Cleanup ───
# What:  Deletes untagged container images older than 30 days from GHCR to
#        control storage costs. Keeps the 5 most recent untagged images.
# Before: Runs weekly on Sunday at 04:00 UTC or manually. No prerequisites.
# After:  Old untagged images are deleted. Tagged images (releases) are preserved.

name: GHCR Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly, Sunday 4 AM UTC
  workflow_dispatch:

permissions:
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OWNER: jpsnover

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - taxonomy-editor
          - ai-triad-base
    steps:
      - name: Delete untagged images older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff: $CUTOFF"
          echo "Package: $PACKAGE"

          # Fetch all versions (paginate up to 200)
          VERSIONS=$(gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --jq '.[]' 2>/dev/null) || {
            echo "No versions found or package does not exist — skipping"
            exit 0
          }

          # Filter to untagged versions older than cutoff
          UNTAGGED=$(echo "$VERSIONS" | jq -s '
            [ .[]
              | select(.metadata.container.tags | length == 0)
            ] | sort_by(.updated_at) | reverse
          ')

          TOTAL=$(echo "$UNTAGGED" | jq 'length')
          echo "Total untagged versions: $TOTAL"

          if [ "$TOTAL" -le 5 ]; then
            echo "5 or fewer untagged versions — nothing to delete"
            exit 0
          fi

          # Keep 5 most recent, delete the rest if older than cutoff
          TO_DELETE=$(echo "$UNTAGGED" | jq --arg cutoff "$CUTOFF" '
            .[5:]
            | [ .[] | select(.updated_at < $cutoff) ]
          ')

          COUNT=$(echo "$TO_DELETE" | jq 'length')
          echo "Versions to delete: $COUNT"

          echo "$TO_DELETE" | jq -r '.[] | "\(.id) \(.updated_at) \(.name)"' | while read -r VID UPDATED NAME; do
            echo "Deleting version $VID (updated $UPDATED, digest $NAME)"
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VID}" \
              --silent || echo "  Failed to delete $VID (may require admin scope)"
          done

          echo "Done — deleted $COUNT untagged versions"
