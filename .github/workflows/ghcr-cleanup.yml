# ─── GHCR Cleanup ───
# What:  Deletes untagged container images older than 30 days from GHCR to
#        control storage costs. Keeps the 5 most recent untagged images.
# Before: Runs weekly on Sunday at 04:00 UTC or manually. No prerequisites.
# After:  Old untagged images are deleted. Tagged images (releases) are preserved.

name: GHCR Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly, Sunday 4 AM UTC
  workflow_dispatch:

permissions:
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - taxonomy-editor
          - ai-triad-base
    steps:
      - name: Delete untagged images older than 30 days
        uses: snok/container-retention-policy@v3.0.1
        with:
          account: user
          token: ${{ github.token }}
          image-names: ${{ matrix.package }}
          cut-off: 30 days ago UTC
          keep-n-most-recent: 5
          tag-selection: untagged
          skip-sha: ${{ github.sha }}
