# Gate-Verification scratch workflow for t/2818 contrast-alert logic.
# Push-triggered on feature branch — GV arms controlled by file edits + pushes.
# TEMPORARY — delete after GV evidence captured and TL clears #1251.
name: GV — contrast-alert scratch

on:
  push:
    branches:
      - feat/contrast-alert-t2818

permissions:
  contents: read
  issues: write

jobs:
  contrast-alert-gv:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate contrast-check PASS
        run: echo "Simulated contrast-check PASS — green path"

      - name: Alert — contrast-check RED (GV)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="ci-alert:contrast"
          TITLE="contrast-check RED on main — ceiling breach"
          BODY_FILE=$(mktemp)
          printf '[GV TEST] contrast-check failure simulation.\n\nRun: %s\n' "${RUN_URL}" > "$BODY_FILE"

          gh label create "$LABEL" --color "B60205" --description "CI: contrast-check alert on main" 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "::error::GV: appended to existing issue #${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file "$BODY_FILE")
            echo "::error::GV: new alert issue created: ${ISSUE_URL}"
          fi
          rm -f "$BODY_FILE"

      - name: Auto-close on green (GV)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-alert:contrast"
          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "GV TEST: contrast-check passed. Auto-closing."
            echo "Closed issue #${EXISTING}"
          else
            echo "No open ci-alert:contrast issue — clean path working correctly"
          fi
