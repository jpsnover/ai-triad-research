# ─── Batch POV Summarization ───
# What:  Runs Invoke-BatchSummary to regenerate POV summaries using AI when
#        the TAXONOMY_VERSION file changes on main.
# Before: Bump TAXONOMY_VERSION in a commit to main. Ensure AI_API_KEY secret
#         is set and the AI backend is reachable.
# After:  Updated summaries are auto-committed to main. The Cluster Conflicts
#         workflow fires automatically on completion.

name: Batch POV Summarization

on:
  push:
    branches: [main]
    paths:
      - 'TAXONOMY_VERSION'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # Large batches may take time

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 2    # Need parent commit to diff taxonomy changes

      - name: Checkout sources repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: jpsnover/ai-triad-sources
          path: ai-triad-sources
          token: ${{ secrets.DATA_REPO_TOKEN || secrets.GITHUB_TOKEN }}  # Scope: contents:read on jpsnover/ai-triad-sources (read-only checkout)
          fetch-depth: 1

      - name: Show taxonomy version
        run: |
          echo "Taxonomy version: $(cat TAXONOMY_VERSION)"
          echo "Changed files: $(git diff HEAD~1 HEAD --name-only)"

      - name: Run smart batch summarization
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL:   ${{ vars.AI_MODEL || 'claude-sonnet-4-6' }}
          AI_TRIAD_SOURCES_ROOT: ${{ github.workspace }}/ai-triad-sources
        run: |
          Import-Module ./scripts/AITriad -Force
          Invoke-BatchSummary -ForceAll

      - name: Commit updated summaries
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7
        with:
          commit_message: "chore: auto-update summaries to taxonomy $(cat TAXONOMY_VERSION)"
          file_pattern: 'summaries/*.json conflicts/*.json'
