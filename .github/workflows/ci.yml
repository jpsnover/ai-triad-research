# ─── CI ───
# What:  Runs all quality gates: Pester tests with coverage, ESLint + TypeScript
#        checks for all 4 Electron apps (matrix), and a container smoke test.
# Before: Triggers automatically on push/PR to main. No manual setup needed.
# After:  All checks must pass before merging. test-container runs in PARALLEL
#         with the test matrix (it reuses no test artifact — t/2073); the
#         always-runs ci-gate job is what blocks the merge on any red gated job.
#
# ── continue-on-error flip taxonomy ──
# FLIPPED — enforcing now (continue-on-error removed):
#   quality-gates (t/1292; .ts/.tsx LOC moved to ESLint max-lines per ADR-007, t/1692)
#   doc-accuracy  doc-link steps (t/2093; repo at zero dead links after t/2092)
# FLIP-PENDING (remove continue-on-error to enforce):
#   doc-accuracy  doc-claims + REPO_MAP steps (t/1324)
# NEVER-FLIP (annotation-only by design — continue-on-error stays permanently):
#   debate-eval        — nondeterministic AI scores, signal not gate (t/1329)
#   commit-hygiene     — visibility not friction, never fails CI (t/1319)
#   schema-validation  — report-only until B-404 deliberately flips it

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── changes: paths-filter that gates which code jobs run per PR ────────────
  # LOAD-BEARING for branch protection (t/1962). `ci-gate` (below) treats a
  # SKIPPED gated job as satisfied — which is only sound *because this filter is
  # sound*. If a filter here is too narrow, a code change can skip a job it
  # should run, and ci-gate would false-green it through the required check.
  # `ci-gate` guards this by keeping `changes` in its `needs` and failing the
  # gate if `changes` itself fails/cancels — but a WRONG-BUT-GREEN filter is not
  # caught. Any edit to these filters must preserve: every code path maps to the
  # job(s) that test it, and every filter includes '.github/workflows/ci.yml' so
  # ci.yml edits run the full suite.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      powershell: ${{ steps.filter.outputs.powershell }}
      electron: ${{ steps.filter.outputs.electron }}
      debate: ${{ steps.filter.outputs.debate }}
      schema: ${{ steps.filter.outputs.schema }}
      lib: ${{ steps.filter.outputs.lib }}
      python: ${{ steps.filter.outputs.python }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            # 'ai-models.json' is in powershell/electron/debate because the AI
            # registry completeness gates run inside those job families (t/2090):
            # powershell -> Test-AIModelsConfig + ModelLiteralLint (Pester);
            # electron   -> keysValidation/resolveApiModelId/configInvariant/
            #               modelDiscovery (taxonomy-editor vitest);
            # debate     -> aiAdapter reads it at runtime for the golden evals.
            # A pure ai-models.json edit used to match NO filter and skip all
            # three, so its own gates never ran in CI (data-only PR ungated).
            powershell:
              - 'scripts/**'
              - 'tests/**'
              - 'lib/**'
              - 'ai-models.json'
              - '.github/workflows/ci.yml'
            electron:
              - 'taxonomy-editor/**'
              - 'poviewer/**'
              - 'summary-viewer/**'
              - 'workflow-app/**'
              - 'lib/**'
              - 'ai-models.json'
              - '.github/workflows/ci.yml'
            debate:
              - 'lib/debate/**'
              - 'evals/**'
              - 'ai-usages.json'
              - 'ai-models.json'
              - '.github/workflows/ci.yml'
            schema:
              - 'taxonomy/schemas/**'
              - 'scripts/validate-schemas.mjs'
              - '.aitriad.json'
              - '.github/workflows/ci.yml'
            lib:
              - 'lib/**'
              - '.github/workflows/ci.yml'
            python:
              - 'scripts/requirements*.txt'
              - '.github/ci/**'
              - '.github/workflows/ci.yml'
            # 'container' gates test-container (t/2094). SOUNDNESS: ci-gate treats
            # a SKIPPED gated job as satisfied, so this list must cover EVERYTHING
            # the container build reads, or a container-affecting change skips the
            # build and false-greens (the t/2025 shape). Derived from the actual
            # COPY set of taxonomy-editor/Dockerfile (builder+prod-deps+runtime
            # stages) + the base Dockerfile + the readiness smoke:
            #   taxonomy-editor/**  — Dockerfile, src, tsconfig*, vite.config,
            #                         scripts, package*.json, pty-broker.py
            #   lib/**              — COPY lib/ (server build input)
            #   ai-models.json, ai-usages.json, .aitriad.json, CHANGELOG.md — COPY'd
            #   taxonomy/schemas/** — COPY taxonomy/schemas/
            #   scripts/**          — COPY scripts/ into the runtime image
            #   deploy/azure/Dockerfile.base — pulled-or-built + hadolint'd here
            #   deploy/azure/smoke-healthz.sh — the readiness smoke this job runs
            # (taxonomy-snapshot/ is STUBBED in-job, so it is NOT a repo input.)
            # '.dockerignore' governs what every COPY actually copies from the
            # root build context (context: .), so a .dockerignore-only edit can
            # change the image — it must trigger the build (t/2094 review, TL2).
            container:
              - 'taxonomy-editor/**'
              - '.dockerignore'
              - 'lib/**'
              - 'scripts/**'
              - 'taxonomy/schemas/**'
              - 'ai-models.json'
              - 'ai-usages.json'
              - '.aitriad.json'
              - 'CHANGELOG.md'
              - 'deploy/azure/Dockerfile.base'
              - 'deploy/azure/smoke-healthz.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/ci.yml'

  test-powershell:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.powershell == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Run Pester tests with coverage
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./scripts/AITriad/Public/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 5
          Invoke-Pester -Configuration $config

      - name: Build module
        shell: pwsh
        run: ./scripts/Build-Module.ps1 -Clean

      - name: Validate built manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./build/AITriad/AITriad.psd1

  test-electron:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.electron == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [taxonomy-editor, poviewer, summary-viewer, workflow-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: dependency audit + provenance moved OUT of this job into the
      # standalone `dependency-audit` job below (t/1800). They used to sit here
      # BEFORE Test with no continue-on-error, so an audit failure skipped Test
      # repo-wide — a gate-integrity false-green. Test must never be masked by
      # the security gate; the two are now independent jobs.

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: pnpm run --if-present lint

      - name: TypeScript check (main)
        working-directory: ${{ matrix.app }}
        run: pnpm exec tsc --noEmit -p tsconfig.main.json

      - name: Test
        # Skip for taxonomy-editor: its "Test with coverage" step below already
        # runs the full vitest suite (and enforces coverage thresholds), so the
        # plain run was pure duplication (~3.5 min wasted per CI run, t/1988).
        # Mutually exclusive with that step: taxonomy-editor → coverage-only;
        # the other apps → plain run only (they have no coverage step).
        if: matrix.app != 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: pnpm run --if-present test

      - name: Test with coverage
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: pnpm exec vitest run --coverage

      - name: Build
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: pnpm run build

  # ── Dependency audit: standalone security gate (t/1800) ──
  # SPLIT OUT of test-electron so a security-audit failure can never skip Test
  # again (the t/1800 false-green: audit sat before Test with no
  # continue-on-error, so its failure on a dependabot high skipped Test +
  # Test-with-coverage repo-wide). This is a REAL hard-failing gate on
  # high/critical advisories in PRODUCTION deps only (--omit=dev; devDeps like
  # the azurite emulator never ship — t/697). check-audit runs
  # .github/scripts/ci-audit.mjs, which fails on any NEW/un-baselined advisory
  # but tolerates the per-app baselines below. Baselines are co-located here
  # (Gate Co-Location) WITH a rationale + owner follow-up ticket; clearing an
  # advisory = delete its baseline line (the owner ticket tracks the dep bump).
  dependency-audit:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.electron == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: taxonomy-editor
            baseline: ""
          - app: poviewer
            baseline: ""
          - app: summary-viewer
            baseline: ""
          - app: workflow-app
            baseline: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies (lockfile for audit)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies (real gate; baselines co-located above)
        working-directory: ${{ matrix.app }}
        env:
          AUDIT_BASELINE: ${{ matrix.baseline }}
        run: node ../.github/scripts/ci-audit.mjs .

      - name: Verify package provenance signatures
        continue-on-error: true
        run: pnpm audit

  # ── Quality gates: 5MB byte-guard + CSS LOC ceiling (t/1292, B-408; ADR-007) ──
  # ENFORCING (t/1692): .ts/.tsx LOC is now owned by ESLint max-lines, co-located
  # in the eslint configs. This gate keeps only what ESLint can't: the 5MB
  # byte-guard, the styles.css ceiling (CSS isn't linted by the TS configs), and
  # tsc error ceilings. continue-on-error removed so the retained guards hard-fail.
  # NOTE: check-quality-gates.sh still prints ::warning:: lines, but exit 1 fails
  # the job regardless; a cosmetic ::warning::->::error:: flip in that
  # PowerShell-owned script is a tracked fast-follow (t/1692).
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Check quality gates
        run: bash scripts/check-quality-gates.sh

  # ── lib lint: ESLint for the shared lib (max-lines ADR-007 + async-safety) ──
  # lib is NOT a test-electron matrix app, so its `eslint .` runs nowhere else in
  # CI — without this job t/1685's max-lines gate is local-only (t/1692). Plain
  # `npm run lint`, NO --max-warnings=0: only ESLint ERRORS gate (hard-fail
  # max-lines + async-safety rules). The ADR-007 soft-warn LOC tier (t/1695,
  # warn@1000/1500) and pre-existing unused-disable warnings are advisory by
  # design; gating on them would re-introduce gate noise (t/1692#1, t/1695).
  lib-lint:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.lib == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install lib dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (errors gate; warnings advisory — see header)
        working-directory: lib
        run: pnpm run lint

  # ── Commit hygiene: flags anonymous / undersized commit subjects (t/1319) ──
  # Annotation-only by design — never flips (t/1319). Visibility, not friction.
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Check commit-subject hygiene
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/check-commit-hygiene.sh

  # ── Doc accuracy gates: claims-lint + REPO_MAP freshness (t/1324, B-403) ──
  # Warning-only until 2026-07-17. To enforce: remove continue-on-error.
  doc-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check doc claims
        continue-on-error: true
        run: bash scripts/check-doc-claims.sh

      # Doc-link check (t/2091): links in main-repo-tracked docs must resolve
      # against `git ls-files`, not the on-disk working tree — a public doc
      # linking an overlay-only path (t/2089) 404s for public-repo viewers.
      # ENFORCING (t/2093): repo at zero dead links after t/2092; gate is now hard.
      - name: Doc link self-test (t/2091 regression)
        run: bash .github/scripts/check-doc-links.sh --self-test

      - name: Check doc links (main-repo presence)
        run: bash .github/scripts/check-doc-links.sh

      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Check REPO_MAP freshness
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile --ignore-scripts > /dev/null 2>&1
          node scripts/depgraph.mjs --repomap > /tmp/repomap-fresh.md
          cd ..
          DRIFT=$(diff REPO_MAP.md /tmp/repomap-fresh.md | wc -l || echo "0")
          if [ "$DRIFT" -gt 20 ]; then
            echo "::warning file=REPO_MAP.md,title=REPO_MAP stale::REPO_MAP.md has $DRIFT lines of drift. Regenerate: cd taxonomy-editor && node scripts/depgraph.mjs --repomap > ../REPO_MAP.md"
          else
            echo "  REPO_MAP.md drift: $DRIFT lines (threshold: 20) OK"
          fi
          if grep -qi "truncated" /tmp/repomap-fresh.md; then
            echo "::error file=REPO_MAP.md,title=REPO_MAP truncated::REPO_MAP.md output contains truncation marker"
            exit 1
          fi

  # ── Debate engine evals (t/1329 Tier 1 + t/1332 Tier 2) ──
  # Tier 1: deterministic regression checks on golden debate outputs (no AI).
  # Tier 2: AI-powered golden debate subset via --ci-golden (needs GEMINI key).
  # Annotation-only by design — never flips (t/1329). Nondeterministic AI
  # scores are signal, not a gate; continue-on-error stays permanently.
  debate-eval:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.debate == 'true')
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.FREE_TIER_GEMINI_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        continue-on-error: true
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        continue-on-error: true
        with:
          node-version: '22'

      - name: Run structural evals (Tier 1)
        continue-on-error: true
        run: node evals/run.mjs

      - name: Install debate engine dependencies (Tier 2)
        if: env.GEMINI_API_KEY != ''
        # Annotation-only by design — never flips (t/1329). EVERY step in this
        # job must carry continue-on-error or a failure here hard-gates CI via
        # the container build's ci-gate (bug found on Tier 2's first live run).
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run golden debate evals (Tier 2)
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm exec tsx lib/debate/cli.ts --ci-golden

  # ── Schema validation (t/1338) ──
  # Validates taxonomy data files against JSON Schemas using ajv.
  # Report-only until B-404 flips to enforcing.
  schema-validation:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.schema == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        continue-on-error: true
        with:
          version: '11.20.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        continue-on-error: true
        with:
          node-version: '22'

      - name: Install dependencies (ajv)
        # Never-flip job — every step must carry continue-on-error (t/1329 lesson).
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate schemas
        continue-on-error: true
        run: node scripts/validate-schemas.mjs

  # ── test-container: build+readiness-smoke, PARALLELIZED off the test jobs (t/2073) ──
  # WAS `needs: [test-powershell, test-electron]` with a `!contains(failure)`
  # guard — i.e. the container build waited for the ENTIRE test matrix before
  # starting, purely as a fail-fast "don't build on red" gate, NOT a data
  # dependency (the Dockerfile does its own `pnpm install`/build and reuses no artifact
  # from those jobs — verified t/2073). That serialization put container
  # (~250s) *after* the long-pole test-electron/taxonomy-editor (~420s), so the
  # merge-gating critical path was electron+container in series (~11–12.5 min).
  # Decoupling it to `needs: [changes]` runs it CONCURRENTLY, collapsing the path
  # to max(electron, container) ≈ electron alone — ~35% off the full-fat path.
  # Coverage is UNCHANGED: `ci-gate` (below) lists test-container in its own
  # `needs` and independently blocks on its failure, so a red container still
  # reds the gate. The only cost is a wasted container build on a PR whose tests
  # already failed — free on this public repo's runner minutes, the tradeoff the
  # ticket sanctions (wall-time over redundant compute).
  #
  # PATHS-FILTERED (t/2094): gated on the `container` filter so docs-only / PS-doc
  # PRs (which touch none of the image's COPY inputs) SKIP the ~270s build — the
  # largest relative win on the PR class the fleet files most. skipped == OK
  # through ci-gate. SOUNDNESS: the `container` filter (in `changes` above) must
  # cover every input the image build reads, or a container-affecting change
  # skips the build and false-greens (t/2025 shape) — see that filter's comment.
  test-container:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.container == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: taxonomy-editor/Dockerfile
          failure-threshold: error

      - name: Lint base Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: deploy/azure/Dockerfile.base
          failure-threshold: error

      - name: Create taxonomy-snapshot stub for Dockerfile COPY layer
        run: |
          mkdir -p taxonomy-snapshot
          echo '{"generated":"none","commit":"none","empty":true}' > taxonomy-snapshot/snapshot-meta.json

      # Best-effort pre-pull with retry: the docker-container driver bootstraps
      # from moby/buildkit pulled off Docker Hub, which intermittently fails
      # "deadline exceeded" at BOOT → false-red before any build runs (t/2065).
      # Pre-pulling into the host image cache means the driver bootstrap reuses
      # the cached image (no re-pull); the retry absorbs transient Hub timeouts.
      # Non-fatal — if all retries fail, setup-buildx still attempts its own pull.
      - name: Pre-pull buildkit image with retry (t/2065)
        run: |
          for i in 1 2 3; do
            if docker pull moby/buildkit:buildx-stable-1; then break; fi
            if [ "$i" -lt 3 ]; then
              echo "buildkit pull attempt $i failed; retry in $((i * 10))s"; sleep $((i * 10))
            else
              echo "buildkit pre-pull failed after $i attempts; setup-buildx will attempt its own pull"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Extract base image tag from Dockerfile
        id: base_tag
        run: |
          TAG=$(grep -oP 'FROM ghcr\.io/jpsnover/ai-triad-base:\K\S+' taxonomy-editor/Dockerfile | head -1)
          echo "tag=${TAG%% *}" >> $GITHUB_OUTPUT
          echo "Base image tag: $TAG"

      - name: Pull or build base image
        env:
          BASE_TAG: ${{ steps.base_tag.outputs.tag }}
        run: |
          if docker pull "ghcr.io/jpsnover/ai-triad-base:$BASE_TAG" 2>/dev/null; then
            echo "Pulled base image from GHCR"
          else
            echo "Base image not in GHCR — building locally"
            docker buildx build --load \
              -f deploy/azure/Dockerfile.base \
              --build-arg PRELOAD_MODEL=false \
              -t "ghcr.io/jpsnover/ai-triad-base:$BASE_TAG" .
          fi

      - name: Build app container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: taxonomy-editor/Dockerfile
          push: false
          load: true
          tags: ai-triad-test:ci

      - name: Run container liveness smoke — server starts + answers (t/2048, t/2067)
        timeout-minutes: 8
        env:
          IMAGE: ai-triad-test:ci
          # LIVENESS: pass as soon as /healthz RESPONDS with any HTTP status (not
          # "000" = connection refused). CI builds bake only a stub snapshot and
          # run without real github-api creds — they can prove the container boots
          # and listens, not that it loaded data. Zero external-service dependency
          # → no github-reachability flake in the required PR gate (t/2067).
          # Readiness (data loaded via github-api fetch) is enforced pre-traffic at
          # the deploy stage by t/2049 (real env + creds) — catches the t/2047
          # class without coupling the required PR gate to api.github.com.
          SMOKE_MODE: liveness
        run: bash deploy/azure/smoke-healthz.sh

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test || true

  # ── python-embed-smoke: validate the pip embedding stack (t/1989) ──────────
  # The pip ecosystem (scripts/requirements.txt) was never installed or exercised
  # in CI, so a dependency change could pass ci-gate with ZERO signal (#191). This
  # installs the stack and asserts embedding VALUE stability — a fresh all-MiniLM-
  # L6-v2 encode must stay cosine>=0.9999 vs a pinned reference (.github/ci/
  # embed_reference.json), the property embeddings.json depends on. (Shape checks
  # are version-stable and blind to numerical drift — see t/1989.) Paths-filtered
  # so normal PRs skip it (skipped = OK through ci-gate). Two stages, split so
  # failure modes stay distinguishable: a red on "Download models" is an HF/network
  # outage; a red on the offline "Assert ... stability" is a REAL drift/incompat.
  # NB: transformers is transitive (not in requirements.txt) so a paths-filter
  # can't catch its bumps — the weekly embed-drift-weekly.yml workflow covers that.
  python-embed-smoke:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.python == 'true')
    runs-on: ubuntu-latest
    # PYTHONUTF8=1: PEP 540 UTF-8 Mode — forces UTF-8 for stdio AND open() on win32.
    # Recurring 7× on the win32 fleet for non-ASCII (em-dashes, arrows, etc.) — t/2046.
    # Harmless on Linux (already UTF-8) but keeps CI/local behaviour uniform.
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Assert PYTHONUTF8=1 is active (t/2046 — a bare export can silently be absent)
        run: |
          python -c "
          import sys
          assert sys.flags.utf8_mode == 1, f'utf8_mode={sys.flags.utf8_mode} expected 1'
          assert sys.stdout.encoding.lower() == 'utf-8', f'stdout={sys.stdout.encoding}'
          assert sys.getfilesystemencoding().lower() == 'utf-8', f'fs={sys.getfilesystemencoding()}'
          print('PYTHONUTF8 assertion OK:', sys.flags.utf8_mode, sys.stdout.encoding, sys.getfilesystemencoding())
          "
      - name: Install Python deps (CPU-only torch to cut install weight)
        working-directory: scripts
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download models (HF availability — a red HERE is infrastructure, not a dep break)
        run: python .github/ci/fetch_embed_models.py
      - name: Assert embedding + NLI value stability (offline — a red HERE is real drift/incompat)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python .github/ci/assert_embed_stability.py

  # ── dependency-coverage: build-path coverage check (t/2077) ────────────────
  # Parses taxonomy-editor/Dockerfile to derive which local packages are compiled
  # into the container but NOT installed by the prod-deps stage. Fails if any
  # runtime dep of those packages is absent from the production stage's installed
  # set — catching the class of gap that was previously caught only by test-container
  # going red (too late). No npm install needed; pure JSON + Dockerfile analysis.
  # Paths-filtered to container + lib changes (the two triggers for a gap):
  #   container — Dockerfile or taxonomy-editor/package.json changed
  #   lib       — lib/package.json changed (new dep may create a gap)
  # Skipped on unrelated PRs (docs-only, PS-only); skip = OK through ci-gate.
  dependency-coverage:
    needs: [changes]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.container == 'true' ||
       needs.changes.outputs.lib == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
      - name: Build-path dependency coverage check
        run: node scripts/ci-audit-build-paths.mjs

  # ── ci-gate: the SINGLE required status context (t/1962) ──────────────────
  # Replaces the 6 individual code-check contexts in branch protection. Those get
  # SKIPPED by path-filtering on non-electron PRs (docs-only, PS-only); a skipped
  # required context never reports `success`, so `strict` protection blocked those
  # PRs permanently (#128, #134). This job always runs and fails only if a gated
  # job FAILED or was CANCELLED (skipped = OK) — so docs/PS-only PRs self-merge
  # while a red code job still blocks. No enforce_admins change.
  #
  # `changes` is in `needs` DELIBERATELY (t/1962 #1/#4/#5): "skipped = OK" is only
  # sound because the path-filter is sound, so a FAILED `changes` job — which would
  # wrongly SKIP the code jobs — must fail the gate too, else untested code
  # false-greens. Scope = exact parity with the pre-t/1962 required-6 (the 3 code
  # job IDs); lib-lint / dependency-audit / schema-validation are intentionally NOT
  # gated here (not required contexts today — separate decision). Add future
  # *required* jobs to `needs`; their path-filtered skips report OK.
  # python-embed-smoke (t/1989) is gated here: validates pip embedding stack value-
  # stability, path-filtered to requirements/.github/ci changes, skip = OK.
  # dependency-coverage (t/2077) is gated here: build-path dep coverage check,
  # path-filtered to container/lib changes, skip = OK.
  ci-gate:
    name: ci-gate
    needs: [changes, test-powershell, test-electron, test-container, python-embed-smoke, dependency-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report gated job results
        run: echo "gated results -> ${{ join(needs.*.result, ' ') }}"
      - name: Block on any failed/cancelled gated job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::ci-gate: a gated job did not pass (see results above)"
          exit 1
