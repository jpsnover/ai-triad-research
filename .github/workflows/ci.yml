# ─── CI ───
# What:  Runs all quality gates: Pester tests with coverage, ESLint + TypeScript
#        checks for all 4 Electron apps (matrix), and a container smoke test.
# Before: Triggers automatically on push/PR to main. No manual setup needed.
# After:  All checks must pass before merging. The test-container job depends on
#         test-powershell and test-electron completing successfully.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout data repo
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Run Pester tests with coverage
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./scripts/AITriad/Public/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 5
          Invoke-Pester -Configuration $config

      - name: Build module
        shell: pwsh
        run: ./scripts/Build-Module.ps1 -Clean

      - name: Validate built manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./build/AITriad/AITriad.psd1

  test-electron:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [taxonomy-editor, poviewer, summary-viewer, workflow-app]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout data repo
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Install shared lib dependencies
        working-directory: lib
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present

      - name: TypeScript check (main)
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm test --if-present

      - name: Test with coverage
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: npx vitest run --coverage

      - name: Build
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: npm run build

  test-container:
    needs: [test-powershell, test-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: taxonomy-editor/Dockerfile
          failure-threshold: error

      - name: Lint base Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/azure/Dockerfile.base
          failure-threshold: error

      - name: Create taxonomy-snapshot stub for Dockerfile COPY layer
        run: |
          mkdir -p taxonomy-snapshot
          echo '{"generated":"none","commit":"none","empty":true}' > taxonomy-snapshot/snapshot-meta.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract base image tag from Dockerfile
        id: base_tag
        run: |
          TAG=$(grep -oP 'FROM ghcr\.io/jpsnover/ai-triad-base:\K\S+' taxonomy-editor/Dockerfile | head -1)
          echo "tag=${TAG%% *}" >> $GITHUB_OUTPUT
          echo "Base image tag: $TAG"

      - name: Pull or build base image
        run: |
          TAG=${{ steps.base_tag.outputs.tag }}
          if docker pull ghcr.io/jpsnover/ai-triad-base:$TAG 2>/dev/null; then
            echo "Pulled base image from GHCR"
          else
            echo "Base image not in GHCR — building locally"
            docker buildx build --load \
              -f deploy/azure/Dockerfile.base \
              --build-arg PRELOAD_MODEL=false \
              -t ghcr.io/jpsnover/ai-triad-base:$TAG .
          fi

      - name: Build app container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: taxonomy-editor/Dockerfile
          push: false
          load: true
          tags: ai-triad-test:ci

      - name: Run container smoke test (GitHub API-first mode)
        run: |
          # No data volume mounted — the app starts with baked fallback data
          # and fetches from GitHub API. In CI we just verify it starts cleanly.
          docker run -d --name smoke-test -p 7862:7862 \
            -e AUTH_DISABLED=1 \
            -e DEPLOY_TAG=ci-test \
            ai-triad-test:ci
          echo "Waiting for container to start..."

          # Health check: 18 × 5s = 90s
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7862/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i!"
              break
            fi
            echo "  Attempt $i/18 — status: $STATUS"
            sleep 5
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::Container smoke test failed — health check did not pass"
            docker logs smoke-test
            exit 1
          fi

          # Verify health response structure
          HEALTH=$(curl -s http://localhost:7862/health)
          echo "Health response:"
          echo "$HEALTH" | python3 -m json.tool 2>/dev/null || echo "$HEALTH"

          # Verify /healthz exists (liveness probe endpoint)
          # May return 503 in CI without GitHub credentials — that's OK
          HZ_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7862/healthz)
          if [ "$HZ_STATUS" = "200" ]; then
            echo "Liveness probe (/healthz) passed!"
          else
            echo "::warning::/healthz returned $HZ_STATUS — expected in CI without GitHub credentials"
          fi

          # Check data availability (may be false in CI without GitHub credentials — that's OK)
          DATA_AVAILABLE=$(curl -s http://localhost:7862/api/data/available)
          echo "Data available: $DATA_AVAILABLE"
          if [ "$DATA_AVAILABLE" = "true" ]; then
            echo "Data availability check passed (fallback data loaded)"
          else
            echo "::warning::Data not available in CI — expected without GitHub App credentials"
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test || true
