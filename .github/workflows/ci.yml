# ─── CI ───
# What:  Runs all quality gates: Pester tests with coverage, ESLint + TypeScript
#        checks for all 4 Electron apps (matrix), and a container smoke test.
# Before: Triggers automatically on push/PR to main. No manual setup needed.
# After:  All checks must pass before merging. The test-container job depends on
#         test-powershell and test-electron completing successfully.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Checkout data repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Run Pester tests with coverage
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./scripts/AITriad/Public/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 5
          Invoke-Pester -Configuration $config

      - name: Build module
        shell: pwsh
        run: ./scripts/Build-Module.ps1 -Clean

      - name: Validate built manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./build/AITriad/AITriad.psd1

  test-electron:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [taxonomy-editor, poviewer, summary-viewer, workflow-app]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Checkout data repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        continue-on-error: true
        with:
          repository: jpsnover/ai-triad-data
          path: ai-triad-data
          fetch-depth: 1

      - name: Symlink data repo to expected location
        run: ln -s "$GITHUB_WORKSPACE/ai-triad-data" ../ai-triad-data
        continue-on-error: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Install shared lib dependencies
        working-directory: lib
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ matrix.app }}
        # Audit production deps only — devDependencies (test/build tooling such as
        # the azurite Storage emulator) never ship in the container, which is
        # built with `npm ci --omit=dev`. Auditing them gated CI on advisories in
        # tooling that has no production impact (t/697 azurite tree). Prod deps
        # are still audited at --audit-level=high.
        run: npm audit --audit-level=high --omit=dev

      - name: Verify package provenance signatures
        working-directory: ${{ matrix.app }}
        continue-on-error: true
        run: npm audit signatures

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present

      - name: TypeScript check (main)
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm test --if-present

      - name: Test with coverage
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: npx vitest run --coverage

      - name: Build
        if: matrix.app == 'taxonomy-editor'
        working-directory: ${{ matrix.app }}
        run: npm run build

  test-container:
    needs: [test-powershell, test-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: taxonomy-editor/Dockerfile
          failure-threshold: error

      - name: Lint base Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: deploy/azure/Dockerfile.base
          failure-threshold: error

      - name: Create taxonomy-snapshot stub for Dockerfile COPY layer
        run: |
          mkdir -p taxonomy-snapshot
          echo '{"generated":"none","commit":"none","empty":true}' > taxonomy-snapshot/snapshot-meta.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Extract base image tag from Dockerfile
        id: base_tag
        run: |
          TAG=$(grep -oP 'FROM ghcr\.io/jpsnover/ai-triad-base:\K\S+' taxonomy-editor/Dockerfile | head -1)
          echo "tag=${TAG%% *}" >> $GITHUB_OUTPUT
          echo "Base image tag: $TAG"

      - name: Pull or build base image
        env:
          BASE_TAG: ${{ steps.base_tag.outputs.tag }}
        run: |
          if docker pull "ghcr.io/jpsnover/ai-triad-base:$BASE_TAG" 2>/dev/null; then
            echo "Pulled base image from GHCR"
          else
            echo "Base image not in GHCR — building locally"
            docker buildx build --load \
              -f deploy/azure/Dockerfile.base \
              --build-arg PRELOAD_MODEL=false \
              -t "ghcr.io/jpsnover/ai-triad-base:$BASE_TAG" .
          fi

      - name: Build app container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: taxonomy-editor/Dockerfile
          push: false
          load: true
          tags: ai-triad-test:ci

      - name: Run container smoke test (GitHub API-first mode)
        timeout-minutes: 8
        run: |
          # No data volume mounted — the app starts with baked fallback data
          # and fetches from GitHub API. In CI we just verify it starts cleanly.
          docker run -d --name smoke-test -p 7862:7862 \
            -e AUTH_DISABLED=1 \
            -e DEPLOY_TAG=ci-test \
            ai-triad-test:ci
          echo "Waiting for container to start..."

          # Diagnostics: verify container is actually running and port is bound
          sleep 5
          echo "=== Container state ==="
          docker inspect smoke-test --format 'Status={{.State.Status}} Running={{.State.Running}} ExitCode={{.State.ExitCode}} Pid={{.State.Pid}}'
          echo "=== Port bindings ==="
          docker port smoke-test 2>/dev/null || echo "No port bindings"
          echo "=== Listening sockets inside container ==="
          docker exec smoke-test sh -c 'ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || echo "no ss/netstat"'
          echo "=== Node.js HTTP check (bypasses curl) ==="
          docker exec smoke-test node -e "
            const h = require('http');
            const r = h.get('http://127.0.0.1:7862/health', {timeout: 5000}, res => {
              let d = ''; res.on('data', c => d += c);
              res.on('end', () => { console.log('HTTP ' + res.statusCode + ': ' + d); process.exit(0); });
            });
            r.on('timeout', () => { console.log('TIMEOUT'); r.destroy(); process.exit(1); });
            r.on('error', e => { console.log('ERROR: ' + e.message); process.exit(1); });
          " || echo "Node HTTP check failed"
          echo "=== Process list ==="
          docker exec smoke-test ps aux 2>/dev/null || docker top smoke-test
          echo "=== Container logs so far ==="
          docker logs smoke-test
          echo ""

          # Health check: 18 attempts × 10s sleep ≈ 180s budget
          for i in $(seq 1 18); do
            STATUS=$(curl -s --max-time 4 -o /dev/null -w "%{http_code}" http://localhost:7862/health 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i!"
              break
            fi
            echo "  Attempt $i/18 — status: ${STATUS:-000}"
            sleep 10
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::Container smoke test failed — health check did not pass"
            echo "=== Final container state ==="
            docker inspect smoke-test --format 'Status={{.State.Status}} Running={{.State.Running}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}}' 2>/dev/null || true
            echo "=== Container logs ==="
            docker logs smoke-test
            exit 1
          fi

          # Verify health response structure
          HEALTH=$(curl -s --max-time 10 http://localhost:7862/health)
          echo "Health response:"
          echo "$HEALTH" | python3 -m json.tool 2>/dev/null || echo "$HEALTH"

          # Verify /healthz exists (liveness probe endpoint)
          # May return 503 in CI without GitHub credentials — that's OK
          HZ_STATUS=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" http://localhost:7862/healthz)
          if [ "$HZ_STATUS" = "200" ]; then
            echo "Liveness probe (/healthz) passed!"
          else
            echo "::warning::/healthz returned $HZ_STATUS — expected in CI without GitHub credentials"
          fi

          # Check data availability (may be false in CI without GitHub credentials — that's OK)
          DATA_AVAILABLE=$(curl -s --max-time 10 http://localhost:7862/api/data/available)
          echo "Data available: $DATA_AVAILABLE"
          if [ "$DATA_AVAILABLE" = "true" ]; then
            echo "Data availability check passed (fallback data loaded)"
          else
            echo "::warning::Data not available in CI — expected without GitHub App credentials"
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test || true
